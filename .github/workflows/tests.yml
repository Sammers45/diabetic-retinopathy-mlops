name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      MLFLOW_DISABLE_AGENT_HINT: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      # TensorFlow tests may skip on dev machines where TF cannot load; in CI they must run.
      DR_REQUIRE_TF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (synthetic data only)
        run: pytest -q
